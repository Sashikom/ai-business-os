services:
  db:
    image: postgres:15-alpine
    container_name: ai-business-os-db
    environment:
      POSTGRES_USER: aibos
      POSTGRES_PASSWORD: aibos123
      POSTGRES_DB: aibos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aibos-net

  redis:
    image: redis:7-alpine
    container_name: ai-business-os-redis
    ports:
      - "6379:6379"
    networks:
      - aibos-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-business-os-backend
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
    networks:
      - aibos-net

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: ai-business-os-bot
    restart: unless-stopped
    env_file:
      - ./telegram-bot/.env
    depends_on:
      - backend
    networks:
      - aibos-net

  backup:
    image: postgres:15-alpine
    container_name: ai-business-os-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: aibos123
    volumes:
      - ./backups:/backups
    networks:
      - aibos-net
    entrypoint: >
      /bin/sh -c "while true; do
        pg_dump -h db -U aibos aibos > /backups/aibos_$$(date +%Y%m%d_%H%M%S).sql.gz;
        find /backups -name '*.sql.gz' -mtime +7 -delete;
        sleep 86400;
      done"
    depends_on:
      - db

volumes:
  postgres_data:

networks:
  aibos-net:
    driver: bridge