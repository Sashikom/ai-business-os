services:
  db:
    image: postgres:15-alpine
    container_name: ai-business-os-db
    environment:
      POSTGRES_USER: aibos
      POSTGRES_PASSWORD: aibos123
      POSTGRES_DB: aibos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aibos-net

  redis:
    image: redis:7-alpine
    container_name: ai-business-os-redis
    ports:
      - "6379:6379"
    networks:
      - aibos-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-business-os-backend
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
    networks:
      - aibos-net

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: ai-business-os-bot
    restart: unless-stopped
    env_file:
      - ./telegram-bot/.env
    depends_on:
      - backend
    networks:
      - aibos-net

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: ai-business-os-admin
    ports:
      - "3000:5173"
    volumes:
      - ./admin-panel:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - aibos-net

volumes:
  postgres_data:

networks:
  aibos-net:
    driver: bridge
